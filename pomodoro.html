<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .timer-display {
            font-size: 4em;
            font-weight: bold;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .session-type {
            font-size: 1.2em;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .start-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            min-width: 80px;
        }

        .start-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.4);
        }

        .stop-btn {
            background: linear-gradient(45deg, #f44336, #da190b);
            color: white;
            min-width: 80px;
        }

        .stop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(244, 67, 54, 0.4);
        }

        .reset-btn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
            min-width: 80px;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(33, 150, 243, 0.4);
        }

        .session-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .session-btn {
            padding: 8px 16px;
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .session-btn.active {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .session-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 4px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            font-size: 0.9em;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            display: block;
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        @media (max-width: 480px) {
            .timer-display {
                font-size: 3em;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            font-weight: bold;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 Pomodoro</h1>
        
        <div class="session-type" id="sessionType">Work Session</div>
        
        <div class="timer-display" id="timer">25:00</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="controls">
            <button class="start-btn" id="startBtn">Start</button>
            <button class="stop-btn" id="stopBtn">Stop</button>
            <button class="reset-btn" id="resetBtn">Reset</button>
        </div>
        
        <div class="session-btns">
            <button class="session-btn active" data-session="25">25 min</button>
            <button class="session-btn" data-session="5">Short Break</button>
            <button class="session-btn" data-session="15">Long Break</button>
        </div>
        
        <div class="stats">
            <div class="stat">
                <span class="stat-number" id="workCount">0</span>
                Work Sessions
            </div>
            <div class="stat">
                <span class="stat-number" id="breakCount">0</span>
                Breaks Taken
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        class PomodoroTimer {
            constructor() {
                this.workTime = 25 * 60; // 25 minutes in seconds
                this.shortBreak = 5 * 60;  // 5 minutes
                this.longBreak = 15 * 60;  // 15 minutes
                this.timeLeft = this.workTime;
                this.isRunning = false;
                this.timerId = null;
                this.currentSession = 'work';
                this.workCount = 0;
                this.breakCount = 0;
                this.isWorkSession = true;
                
                this.initializeElements();
                this.updateDisplay();
                this.bindEvents();
            }

            initializeElements() {
                this.timerEl = document.getElementById('timer');
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.sessionTypeEl = document.getElementById('sessionType');
                this.progressFill = document.getElementById('progressFill');
                this.notification = document.getElementById('notification');
                this.workCountEl = document.getElementById('workCount');
                this.breakCountEl = document.getElementById('breakCount');
            }

            bindEvents() {
                this.startBtn.addEventListener('click', () => this.start());
                this.stopBtn.addEventListener('click', () => this.stop());
                this.resetBtn.addEventListener('click', () => this.reset());
                
                document.querySelectorAll('.session-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.setSession(e.target.dataset.session));
                });
            }

            setSession(duration) {
                document.querySelectorAll('.session-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                
                if (duration === '25') {
                    this.timeLeft = this.workTime;
                    this.currentSession = 'work';
                    this.isWorkSession = true;
                    this.sessionTypeEl.textContent = 'Work Session';
                } else if (duration === '5') {
                    this.timeLeft = this.shortBreak;
                    this.currentSession = 'short';
                    this.isWorkSession = false;
                    this.sessionTypeEl.textContent = 'Short Break';
                } else {
                    this.timeLeft = this.longBreak;
                    this.currentSession = 'long';
                    this.isWorkSession = false;
                    this.sessionTypeEl.textContent = 'Long Break';
                }
                
                this.updateDisplay();
            }

            start() {
                if (this.isRunning) return;
                
                this.isRunning = true;
                this.startBtn.disabled = true;
                this.startBtn.textContent = 'Running';
                
                this.timerId = setInterval(() => {
                    this.timeLeft--;
                    this.updateDisplay();
                    
                    if (this.timeLeft <= 0) {
                        this.stop();
                        this.sessionComplete();
                    }
                }, 1000);
            }

            stop() {
                this.isRunning = false;
                clearInterval(this.timerId);
                this.startBtn.disabled = false;
                this.startBtn.textContent = 'Start';
            }

            reset() {
                this.stop();
                this.setSession('25');
            }

            updateDisplay() {
                const minutes = Math.floor(this.timeLeft / 60);
                const seconds = this.timeLeft % 60;
                this.timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                const totalTime = this.isWorkSession ? this.workTime : (this.currentSession === 'short' ? this.shortBreak : this.longBreak);
                const progress = ((totalTime - this.timeLeft) / totalTime) * 100;
                this.progressFill.style.width = `${progress}%`;
                
                this.workCountEl.textContent = this.workCount;
                this.breakCountEl.textContent = this.breakCount;
            }

            sessionComplete() {
                if (this.isWorkSession) {
                    this.workCount++;
                    this.showNotification('Work session completed! 🎉 Take a break.');
                } else {
                    this.breakCount++;
                    this.showNotification('Break time over! 💪 Back to work.');
                }
                
                // Auto switch to next session
                if (this.isWorkSession) {
                    this.setSession('5'); // Short break
                } else {
                    this.setSession('25'); // Back to work
                }
                
                // Play notification sound
                this.playNotificationSound();
            }

            showNotification(message) {
                this.notification.textContent = message;
                this.notification.classList.add('show');
                
                setTimeout(() => {
                    this.notification.classList.remove('show');
                }, 3000);
            }

            playNotificationSound() {
                // Create and play a simple beep sound
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            }
        }

        // Initialize the Pomodoro timer when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new PomodoroTimer();
        });
    </script>
</body>
</html>
